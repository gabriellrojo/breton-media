
<!DOCTYPE html>
<html lang="pt-BR"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">

  <title>Breton — Prêmio Reclame AQUI 2026</title>

  <!--[if mso]>
  <xml>
    <o:OfficeDocumentSettings>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->

  <style>
    @font-face {
      font-family: 'DIN Pro';
      src: url('https://gabriellrojo.github.io/breton-media/email-reclame-aqui/DINPro-Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: 'DIN Pro';
      src: url('https://gabriellrojo.github.io/breton-media/email-reclame-aqui/DINPro.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'DIN Pro';
      src: url('https://gabriellrojo.github.io/breton-media/email-reclame-aqui/DINPro-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      background: #ffffff !important;
    }

    table {
      border-spacing: 0;
      border-collapse: collapse;
    }

    @media screen and (max-width:620px) {
      .email-container {
        width: 100% !important;
        max-width: 600px !important;
      }

      .bg-content {
        background-size: 100% 100% !important;
      }

      .top-space {
        height: auto !important;
        padding-top: 81.7% !important;
      }

      .footer-space {
        height: auto !important;
        padding-top: 49% !important;
      }

      .line-pad {
        padding-left: 7% !important;
        padding-right: 7% !important;
      }
    }
  </style>
</head>

<body style="margin:0;padding:0;background-color:#ffffff;">

  <table
    role="presentation"
    cellpadding="0"
    cellspacing="0"
    border="0"
    width="100%"
    bgcolor="#ffffff"
    style="width:100%;background-color:#ffffff;"
  >
    <tr>
      <td align="center">

        <table
          role="presentation"
          cellpadding="0"
          cellspacing="0"
          border="0"
          width="600"
          class="email-container"
          style="width:600px;max-width:600px;"
        >
          <tr>
            <td
              class="bg-content"
              background="https://gabriellrojo.github.io/breton-media/email-reclame-aqui/bg.png"
              bgcolor="#661d34"
              valign="top"
              style="
                background-color:#661d34;
                background-image:url('https://gabriellrojo.github.io/breton-media/email-reclame-aqui/bg.png');
                background-position:center top;
                background-repeat:no-repeat;
                background-size:100% 100%;
              "
            >

              <!--[if gte mso 9]>
              <v:rect
                xmlns:v="urn:schemas-microsoft-com:vml"
                fill="true"
                stroke="false"
                style="width:450pt;height:590.625pt;"
              >
                <v:fill
                  type="frame"
                  src="https://gabriellrojo.github.io/breton-media/email-reclame-aqui/bg.png"
                  color="#661d34"
                />
                <v:textbox inset="0,0,0,0">
              <![endif]-->

              <table
                role="presentation"
                cellpadding="0"
                cellspacing="0"
                border="0"
                width="100%"
                style="width:100%;"
              >

                <!-- ESPAÇO SUPERIOR -->
                <tr>
                  <td
                    class="top-space"
                    height="490"
                    style="
                      height:490px;
                      font-size:0;
                      line-height:0;
                    "
                  >&nbsp;</td>
                </tr>

                <!-- LINHA BRANCA SUPERIOR DO FOOTER -->
                <tr>
                  <td
                    class="line-pad"
                    style="padding:0 62px;"
                  >
                    <table
                      role="presentation"
                      cellpadding="0"
                      cellspacing="0"
                      border="0"
                      width="100%"
                      style="width:100%;"
                    >
                      <tr>
                        <td
                          height="1"
                          bgcolor="#ffffff"
                          style="
                            height:1px;
                            line-height:1px;
                            font-size:1px;
                            background-color:#ffffff;
                          "
                        >&nbsp;</td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- ESPAÇO DO FOOTER -->
                <tr>
                  <td
                    class="footer-space"
                    height="296"
                    style="
                      height:296px;
                      font-size:0;
                      line-height:0;
                    "
                  >&nbsp;</td>
                </tr>

              </table>

              <!--[if gte mso 9]>
                </v:textbox>
              </v:rect>
              <![endif]-->

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
